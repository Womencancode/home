<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Example: a waitlist that saves</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#0f2a2a;color:#eafff7;display:grid;place-items:center;min-height:100vh}main{max-width:520px;padding:32px}h1{font-size:40px;margin:0 0 8px}input,button{font:inherit;padding:12px 14px;border-radius:10px;border:0}input{width:100%;box-sizing:border-box;margin:8px 0}button{background:#7cf5c8;color:#0f2a2a;font-weight:700;cursor:pointer}ol{background:#163b3b;border-radius:12px;padding:14px 14px 14px 36px}.note{font-size:13px;opacity:.85}</style></head>
<body><main><p class="note">Example page made for Women Can Code, day 3. It saves sign-ups in this browser only.</p><h1>Plant swap, coming soon</h1><p>Leave your name and email and we will tell you the first date.</p>
<form id="f"><label for="n">Name</label><input id="n" required><label for="e">Email</label><input id="e" type="email" required><button>Join the waitlist</button></form>
<h2>Saved so far</h2><ol id="list"><li>Sam (sam@example.com)</li><li>Priya (priya@example.com)</li></ol></main>
<script src="waitlist.js"></script></body></html>
